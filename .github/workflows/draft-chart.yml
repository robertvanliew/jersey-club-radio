name: Publish Rising Now chart

# Every Monday: build this week's chart from SoundCloud growth and publish it by
# committing straight to master (Vercel deploys it). No review step: the drafter cleans
# titles, credits remixers, keeps one entry per song and boosts the core Jersey club scene.
# If the drafter fails, the job fails and GitHub emails the repo owner; the player-health
# job also fails once the chart is more than 8 days old.
on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC (9am New York)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rising-now
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build chart from SoundCloud
        run: node scripts/draft-chart.mjs --force | tee draft.log
      - name: Commit and publish
        run: |
          git config user.name "Rising Now bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/charts/*.json data/chart-snapshots/*.json
          if git diff --cached --quiet; then echo "Nothing new to publish"; exit 0; fi
          week=$(ls src/data/charts/ | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | sort | tail -1 | cut -c1-10)
          git commit -m "Rising Now: week of $week"
          git pull --rebase origin master
          git push origin HEAD:master
